<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Authorization — Sayxrosnimos</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #0a0a0a; color: #f0f0f0;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .box { background: #111; border: 1px solid #222; border-radius: 20px;
         padding: 48px; max-width: 560px; width: 90%; text-align: center; }
  h1 { font-size: 28px; margin-bottom: 12px; color: #e2c27d; }
  .status { font-size: 16px; color: #888; margin-bottom: 32px; }
  .code-block { background: #1a1a1a; border: 2px solid #e2c27d44; border-radius: 12px;
                padding: 20px; margin: 24px 0; word-break: break-all; }
  .code-label { font-size: 12px; color: #666; text-transform: uppercase;
                letter-spacing: 1px; margin-bottom: 8px; }
  .code-value { font-family: monospace; font-size: 15px; color: #e2c27d;
                user-select: all; cursor: pointer; line-height: 1.5; }
  .copy-btn { background: #e2c27d; color: #000; border: none; border-radius: 10px;
              padding: 14px 32px; font-size: 16px; font-weight: 700; cursor: pointer;
              width: 100%; margin-top: 8px; transition: opacity .2s; }
  .copy-btn:hover { opacity: .85; }
  .copy-btn.copied { background: #4caf50; color: white; }
  .instructions { background: #0f1f0f; border: 1px solid #1a3a1a; border-radius: 12px;
                  padding: 20px; margin-top: 24px; text-align: left; }
  .instructions p { font-size: 14px; color: #7a7; line-height: 1.7; margin: 0; }
  .error-box { background: #1f0f0f; border: 1px solid #3a1a1a; border-radius: 12px;
               padding: 24px; color: #f88; }
</style>
</head>
<body>
<div class="box" id="main">
  <h1>🔐 TikTok Authorization</h1>
  <p class="status" id="status">Processing...</p>
  <div id="content"></div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const code   = params.get('code');
  const error  = params.get('error');
  const errDesc = params.get('error_description');
  const content = document.getElementById('content');
  const status  = document.getElementById('status');

  if (code) {
    status.textContent = 'Authorization successful! Copy the code below:';
    status.style.color = '#4caf50';
    content.innerHTML = `
      <div class="code-block">
        <div class="code-label">Authorization Code (click to select all)</div>
        <div class="code-value" id="codeVal" onclick="selectAll()">${code}</div>
      </div>
      <button class="copy-btn" id="copyBtn" onclick="copyCode()">Copy Code</button>
      <div class="instructions">
        <p>
          1. Click "Copy Code" above<br>
          2. Go back to the terminal (PowerShell)<br>
          3. Paste the code and press Enter<br>
          4. The access token will be saved automatically
        </p>
      </div>
    `;
  } else if (error) {
    status.textContent = 'Authorization failed';
    status.style.color = '#f44';
    content.innerHTML = `
      <div class="error-box">
        <strong>Error:</strong> ${error}<br>
        <small>${errDesc || ''}</small>
      </div>
    `;
  } else {
    status.textContent = 'No authorization code found.';
  }

  function copyCode() {
    navigator.clipboard.writeText(code).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy Code'; btn.classList.remove('copied'); }, 2500);
    });
  }

  function selectAll() {
    const el = document.getElementById('codeVal');
    const range = document.createRange();
    range.selectNodeContents(el);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
  }
</script>
</body>
</html>
